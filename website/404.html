<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found | RS Links Consultants</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1B25">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A1B25;color:#E8EFEC;font:400 17px/1.6 "Figtree",system-ui,sans-serif;padding:24px;text-align:center;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  div{position:relative;max-width:520px}
  b{display:block;font:800 clamp(90px,20vw,180px)/1 "Bricolage Grotesque",system-ui,sans-serif;color:#3DBB8A;letter-spacing:-.04em}
  h1{font:800 32px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:10px 0 12px}
  p{color:#93A9A7;margin:0 0 28px}
  a{display:inline-block;background:#3DBB8A;color:#04130D;font-weight:600;text-decoration:none;padding:14px 22px;border-radius:999px}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div><b>404</b><h1>This page has moved on.</h1><p>The page you're looking for doesn't exist. Let's get you back on route.</p><a href="./">Go to the homepage</a></div>
<script>
(function(){var c=document.getElementById("c"),x=c.getContext("2d"),W,H,P=[];function r(){W=c.width=innerWidth;H=c.height=innerHeight;P=[];for(var i=0;i<70;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4})}
function d(){x.clearRect(0,0,W,H);for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle="rgba(200,220,215,.6)";x.fillRect(p.x,p.y,2,2);for(var j=i+1;j<P.length;j++){var q=P[j],k=Math.hypot(p.x-q.x,p.y-q.y);if(k<120){x.strokeStyle="rgba(61,187,138,"+(.2*(1-k/120))+")";x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}requestAnimationFrame(d)}
addEventListener("resize",r);r();d()})();
</script>
</body>
</html>
